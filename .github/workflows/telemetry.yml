name: Atualizar Telemetria Short.io

on:
  schedule:
    - cron: '0 12 * * *' # Executa diariamente ao meio-dia (UTC)
  workflow_dispatch: # Permite execução manual na aba "Actions"

jobs:
  update-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: pip install requests

      - name: Executar Script de Telemetria
        env:
          SHORT_IO_API_KEY: ${{ secrets.SHORT_IO_API_KEY }}
          SHORT_IO_LINK_ID: ${{ secrets.SHORT_IO_LINK_ID }}
        run: python scripts/fetch_telemetry.py

      - name: Commit e Push das alterações
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --staged --quiet || git commit -m "docs: atualiza telemetria de cliques (Short.io)"
          git push