name: Atualizar Telemetria Short.io

on:
  schedule:
    - cron: '0 12,18,0 * * *' 
  workflow_dispatch:

jobs:
  update-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: pip install requests pandas matplotlib

      - name: Executar Script de Telemetria
        env:
          SHORT_IO_API_KEY: ${{ secrets.SHORT_IO_API_KEY }}
          SHORT_IO_LINK_ID: ${{ secrets.SHORT_IO_LINK_ID }}
        run: python scripts/fetch_telemetry.py

      - name: Commit e Push das alterações
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md assets/telemetry_history.csv assets/telemetry_chart.png
          git diff --staged --quiet || git commit -m "docs: atualiza telemetria e gráfico de evolução"
          git push